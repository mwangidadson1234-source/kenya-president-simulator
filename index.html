<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statecraft Kenya: Modern Presidential Simulator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [inaugurated, setInaugurated] = useState(false);
      const [week, setWeek] = useState(1);
      const [activeTab, setActiveTab] = useState('home');
      const [selectedInboxTab, setSelectedInboxTab] = useState('unread');
      const [selectedMail, setSelectedMail] = useState(null);
      const [selectedBill, setSelectedBill] = useState(null);

      // State Metrics
      const [authority, setAuthority] = useState(85);
      const [treasury, setTreasury] = useState(420);
      const [debtRatio, setDebtRatio] = useState(68);
      const [whipScore, setWhipScore] = useState(72);
      const [inflation, setInflation] = useState(6.4);
      const [publicApproval, setPublicApproval] = useState(62);
      const [uprisingRisk, setUprisingRisk] = useState(18);
      const [impeachmentRisk, setImpeachmentRisk] = useState(12);

      const [demographics, setDemographics] = useState({
        hustlers: 65,
        civilSociety: 48,
        businessElites: 70,
        ruralFarmers: 60
      });

      const [military, setMilitary] = useState({
        readiness: 88,
        troopCount: 45000,
        deployedTroops: 6500,
        activeOperations: [
          { id: 1, name: 'Operation Linda Mpaka (Somalia Border)', troops: 3500, risk: 'Medium', cost: 1.2 },
          { id: 2, name: 'EAC Regional Force (Eastern DRC)', troops: 3000, risk: 'High', cost: 2.5 }
        ]
      });

      const candidatePool = {
        treasury: [
          { name: 'Dr. John K. Njuguna', competence: 92, loyalty: 65, region: 'Central' },
          { name: 'Hon. Wycliffe O. Musalia', competence: 78, loyalty: 90, region: 'Western' },
          { name: 'Prof. Nzioka Waita', competence: 88, loyalty: 70, region: 'Eastern' }
        ],
        interior: [
          { name: 'Gen. Raymond O. Kibwana', competence: 94, loyalty: 85, region: 'Rift Valley' },
          { name: 'Hon. Kithure A. Kindiki', competence: 85, loyalty: 95, region: 'Eastern' },
          { name: 'Aisha J. Mohamed', competence: 80, loyalty: 75, region: 'Coast' }
        ],
        foreign: [
          { name: 'Amb. Macharia Kamau', competence: 90, loyalty: 70, region: 'Central' },
          { name: 'Dr. Korir A. Sing’oei', competence: 86, loyalty: 92, region: 'Rift Valley' }
        ],
        health: [
          { name: 'Dr. Nakhumicha S. Wafula', competence: 72, loyalty: 88, region: 'Western' },
          { name: 'Dr. Mercy Mwangangi', competence: 89, loyalty: 75, region: 'Eastern' }
        ],
        defense: [
          { name: 'Hon. Aden B. Duale', competence: 85, loyalty: 94, region: 'North Eastern' },
          { name: 'Gen. Samson J. Mwathethe', competence: 95, loyalty: 80, region: 'Coast' }
        ],
        education: [
          { name: 'Prof. Ezekiel O. Machogu', competence: 75, loyalty: 90, region: 'Nyanza' },
          { name: 'Dr. Beatrice Inyangala', competence: 88, loyalty: 82, region: 'Western' }
        ],
        agri: [
          { name: 'Hon. Linturi F. Mithika', competence: 70, loyalty: 85, region: 'Eastern' },
          { name: 'Dr. Andrew Tuimur', competence: 86, loyalty: 88, region: 'Rift Valley' }
        ],
        ag: [
          { name: 'Justin B. Muturi', competence: 88, loyalty: 90, region: 'Central' },
          { name: 'Dorcas A. Oduor', competence: 92, loyalty: 85, region: 'Nyanza' }
        ]
      };

      const [cabinet, setCabinet] = useState({
        treasury: null, interior: null, foreign: null, health: null,
        defense: null, education: null, agri: null, ag: null
      });

      const [emails, setEmails] = useState([
        {
          id: 1,
          sender: 'State House Chief of Staff',
          subject: 'Inaugural Executive Briefing & Priority Outlook',
          category: 'unread',
          status: 'pending',
          date: 'Week 1',
          body: 'Your Excellency, the Cabinet swearing-in protocol is complete. Intelligence reports indicate brewing public agitation over high fuel prices and unfulfilled subsidy promises. The National Treasury recommends immediate tax restructuring.',
          options: [
            { text: 'Authorize Emergency Fuel Cushioning Levy (-15B KSh, +8% Hustlers Approval)', authority: -3, treasury: -15, hustlers: 8, risk: -5 },
            { text: 'Maintain Strict Budgetary Austerity (+25B KSh Treasury, -10% Hustlers Approval)', authority: 2, treasury: 25, hustlers: -10, risk: 8 }
          ]
        }
      ]);

      const [petitions, setPetitions] = useState([
        {
          id: 101,
          organization: 'Kenya Medical Practitioners Union (KMPDU)',
          title: 'Demands for CBA Implementation & Intern Posting',
          urgency: 'HIGH',
          description: 'Public health workers threaten a nation-wide strike within 7 days unless funds are released for medical interns.',
          options: [
            { text: 'Accede to Union Demands (-12B KSh Treasury, -10% Uprising Risk)', treasury: -12, risk: -10 },
            { text: 'Declare Strike Illegal & Enforce Mandatory Work Order (+15% Uprising Risk)', treasury: 0, risk: 15 }
          ]
        }
      ]);

      const [bills, setBills] = useState([
        {
          id: 201,
          ministry: 'National Treasury',
          title: 'Finance Bill 2026 (Tax Rationalization)',
          stage: 'Presidential Assent Desk',
          description: 'Introduces a 2.5% Motor Vehicle Circulation Tax and adjusts VAT exemptions.',
          fiscalImpact: '+65B KSh Annual Revenue',
          publicImpact: '-14% Overall Public Approval',
          status: 'pending'
        }
      ]);

      const [countries, setCountries] = useState([
        { id: 'UG', name: 'Uganda', region: 'EAC Ally', relation: 85, status: 'Ally', tradeDeal: 'Active EAC Transit Tariff Waiver' },
        { id: 'TZ', name: 'Tanzania', region: 'EAC Partner', relation: 65, status: 'Neutral', tradeDeal: 'Non-Tariff Barrier Disputes' },
        { id: 'CN', name: 'China', region: 'Global Superpower', relation: 78, status: 'Major Creditor', tradeDeal: 'SGR Refinancing & Belt/Road' },
        { id: 'US', name: 'United States', region: 'Global Superpower', relation: 80, status: 'Strategic Security Partner', tradeDeal: 'STIP Trade Negotiations' }
      ]);

      const advanceWeek = () => {
        const newWeek = week + 1;
        setWeek(newWeek);
        
        // Random procedural scenario
        setEmails(prev => [
          {
            id: Date.now(),
            sender: 'National Assembly Chief Whip',
            subject: `Backbench Policy Briefing (Week ${newWeek})`,
            body: `Your Excellency, backbenchers are demanding consultations regarding upcoming development fund disbursements for Week ${newWeek}.`,
            options: [
              { text: 'Allocate Constituency Development Funds (-10B KSh, +8 Whip Score)', treasury: -10, whip: 8 },
              { text: 'Hold Ground and Deny Discretionary Funds (-5 Whip Score, +5 Authority)', authority: 5, whip: -5 }
            ]
          },
          ...prev
        ]);
      };

      const handleMailChoice = (mail, option) => {
        if (option.authority) setAuthority(a => Math.min(100, Math.max(0, a + option.authority)));
        if (option.treasury) setTreasury(t => t + option.treasury);
        if (option.hustlers) setDemographics(d => ({ ...d, hustlers: Math.min(100, Math.max(0, d.hustlers + option.hustlers)) }));
        if (option.risk) setUprisingRisk(r => Math.min(100, Math.max(0, r + option.risk)));
        if (option.whip) setWhipScore(w => Math.min(100, Math.max(0, w + option.whip)));

        setEmails(emails.map(e => e.id === mail.id ? { ...e, category: 'read', status: 'resolved' } : e));
        setSelectedMail(null);
      };

      const handlePetitionChoice = (pet, option) => {
        if (option.treasury) setTreasury(t => t + option.treasury);
        if (option.risk) setUprisingRisk(r => Math.min(100, Math.max(0, r + option.risk)));
        setPetitions(petitions.filter(p => p.id !== pet.id));
      };

      const handleBillAction = (bill, action) => {
        if (action === 'assent') {
          setTreasury(t => t + 65);
          setPublicApproval(p => Math.max(10, p - 12));
          setBills(bills.map(b => b.id === bill.id ? { ...b, stage: 'Enacted into Law', status: 'enacted' } : b));
        } else {
          setWhipScore(w => Math.max(20, w - 8));
          setBills(bills.map(b => b.id === bill.id ? { ...b, stage: 'Vetoed & Returned', status: 'vetoed' } : b));
        }
        setSelectedBill(null);
      };

      const isCabinetComplete = Object.values(cabinet).every(val => val !== null);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between">
          
          {/* WEEK 1 INAUGURATION CABINET SETUP */}
          {!inaugurated && (
            <div className="fixed inset-0 z-50 bg-slate-950/95 p-6 overflow-y-auto flex flex-col items-center">
              <div className="max-w-4xl w-full space-y-6 my-auto">
                <div className="text-center space-y-2">
                  <span className="px-3 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-full text-xs font-semibold uppercase">
                    State House Gazette Notice
                  </span>
                  <h1 className="text-3xl font-extrabold text-amber-500">
                    H.E. The President of Kenya, Commander-in-Chief
                  </h1>
                  <p className="text-slate-400 text-sm">
                    Select your Cabinet Secretaries across all 8 core dockets to take your oath of office.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {Object.keys(candidatePool).map(docket => (
                    <div key={docket} className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                      <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span className="font-bold text-slate-200 capitalize text-sm">
                          {docket === 'ag' ? 'Attorney General' : `CS ${docket}`}
                        </span>
                        {cabinet[docket] && <span className="text-xs text-emerald-400 font-bold">Appointed</span>}
                      </div>

                      <div className="space-y-2">
                        {candidatePool[docket].map(cand => (
                          <div 
                            key={cand.name}
                            onClick={() => setCabinet(prev => ({ ...prev, [docket]: cand }))}
                            className={`p-3 rounded-lg border text-xs cursor-pointer flex justify-between items-center ${
                              cabinet[docket]?.name === cand.name 
                                ? 'bg-amber-500/20 border-amber-500 text-white' 
                                : 'bg-slate-950 border-slate-800 text-slate-300'
                            }`}
                          >
                            <div>
                              <div className="font-semibold">{cand.name}</div>
                              <div className="text-slate-500 text-[10px]">Region: {cand.region}</div>
                            </div>
                            <div className="text-right text-[11px]">
                              <span className="text-blue-400">Comp: {cand.competence}%</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>

                <button
                  disabled={!isCabinetComplete}
                  onClick={() => setInaugurated(true)}
                  className={`w-full py-4 rounded-xl font-bold text-sm uppercase tracking-wider transition-all ${
                    isCabinetComplete 
                      ? 'bg-amber-500 hover:bg-amber-400 text-slate-950 cursor-pointer shadow-lg shadow-amber-500/20' 
                      : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                  }`}
                >
                  {isCabinetComplete ? 'Take Oath of Office & Begin Term' : 'Appoint All Ministers to Proceed'}
                </button>
              </div>
            </div>
          )}

          {/* HEADER */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
              <div>
                <h1 className="text-lg font-black text-amber-500 flex items-center gap-2">
                  H.E. The President of Kenya, Commander-in-Chief
                </h1>
                <div className="text-xs text-slate-400 flex items-center gap-3">
                  <span>Term: <strong className="text-slate-200">Year {Math.ceil(week / 52)}, Week {week % 52 === 0 ? 52 : week % 52}</strong> ({week} / 240 Weeks)</span>
                  <span>•</span>
                  <span>Authority: <strong className="text-amber-400">{authority}%</strong></span>
                </div>
              </div>

              <div className="flex items-center gap-3 text-xs">
                <div className="bg-slate-950 border border-slate-800 rounded-lg p-2">
                  <div className="text-slate-400 text-[10px]">TREASURY</div>
                  <div className="font-bold text-amber-400">KSh {treasury}B</div>
                </div>
                <div className="bg-slate-950 border border-slate-800 rounded-lg p-2">
                  <div className="text-slate-400 text-[10px]">UPRISING RISK</div>
                  <div className={`font-bold ${uprisingRisk > 50 ? 'text-red-400' : 'text-emerald-400'}`}>{uprisingRisk}%</div>
                </div>
                <button 
                  onClick={advanceWeek}
                  className="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-lg font-black text-xs uppercase tracking-wider cursor-pointer"
                >
                  Advance Week &gt;
                </button>
              </div>
            </div>
          </header>

          {/* TABS */}
          <main className="max-w-7xl mx-auto px-4 py-6 w-full flex-grow">
            <div className="flex border-b border-slate-800 gap-2 mb-6 overflow-x-auto pb-1">
              {[
                { id: 'home', label: 'Executive Dashboard' },
                { id: 'inbox', label: `Inbox (${emails.filter(e => e.category === 'unread').length})` },
                { id: 'petitions', label: `Grassroots (${petitions.length})` },
                { id: 'bills', label: 'Legislative Desk' },
                { id: 'cabinet', label: 'Cabinet & Whip' },
                { id: 'military', label: 'KDF Command' },
                { id: 'world', label: 'World Matrix' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2.5 rounded-t-lg font-bold text-xs transition-all border-b-2 cursor-pointer ${
                    activeTab === tab.id
                      ? 'border-amber-500 text-amber-400 bg-slate-900/60'
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {/* TAB CONTENT */}
            {activeTab === 'home' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <span className="text-slate-400 text-xs font-semibold">Public Approval Rating</span>
                    <div className="text-2xl font-black text-slate-100">{publicApproval}%</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <span className="text-slate-400 text-xs font-semibold">Whip Control</span>
                    <div className="text-2xl font-black text-slate-100">{whipScore}%</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <span className="text-slate-400 text-xs font-semibold">Debt / GDP Ratio</span>
                    <div className="text-2xl font-black text-slate-100">{debtRatio}%</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <span className="text-slate-400 text-xs font-semibold">Inflation Index</span>
                    <div className="text-2xl font-black text-slate-100">{inflation}%</div>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                  <h3 className="font-bold text-sm text-slate-200 uppercase border-b border-slate-800 pb-2">Demographic Approvals</h3>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    {Object.entries(demographics).map(([key, val]) => (
                      <div key={key} className="bg-slate-950 p-3 rounded-lg border border-slate-800">
                        <div className="text-xs capitalize text-slate-300">{key}</div>
                        <div className="text-lg font-bold text-amber-400">{val}%</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'inbox' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                  <div className="space-y-2">
                    {emails.map(mail => (
                      <div
                        key={mail.id}
                        onClick={() => setSelectedMail(mail)}
                        className={`p-3 rounded-lg border cursor-pointer text-xs space-y-1 ${
                          selectedMail?.id === mail.id ? 'bg-amber-500/10 border-amber-500' : 'bg-slate-950 border-slate-800'
                        }`}
                      >
                        <div className="font-bold text-slate-200">{mail.sender}</div>
                        <div className="text-slate-300 truncate">{mail.subject}</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="md:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-6">
                  {selectedMail ? (
                    <div className="space-y-4">
                      <h2 className="text-lg font-bold text-amber-400">{selectedMail.subject}</h2>
                      <p className="text-sm text-slate-300">{selectedMail.body}</p>
                      {selectedMail.status === 'pending' && (
                        <div className="space-y-2 pt-4 border-t border-slate-800">
                          {selectedMail.options.map((opt, idx) => (
                            <button
                              key={idx}
                              onClick={() => handleMailChoice(selectedMail, opt)}
                              className="w-full text-left p-3 rounded-lg bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs text-slate-200 cursor-pointer"
                            >
                              {opt.text}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="h-full flex items-center justify-center text-slate-500 text-xs">Select an email dispatch.</div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'petitions' && (
              <div className="space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {petitions.map(pet => (
                    <div key={pet.id} className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3">
                      <div className="font-bold text-amber-400 text-xs">{pet.organization}</div>
                      <h4 className="font-bold text-sm text-slate-100">{pet.title}</h4>
                      <p className="text-xs text-slate-300">{pet.description}</p>
                      <div className="space-y-2">
                        {pet.options.map((opt, i) => (
                          <button
                            key={i}
                            onClick={() => handlePetitionChoice(pet, opt)}
                            className="w-full text-left p-2.5 rounded bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs text-slate-200 cursor-pointer"
                          >
                            {opt.text}
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'bills' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {bills.map(bill => (
                  <div key={bill.id} className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3">
                    <div className="text-xs text-amber-400 font-semibold">{bill.ministry}</div>
                    <h4 className="font-bold text-sm text-slate-100">{bill.title}</h4>
                    <p className="text-xs text-slate-300">{bill.description}</p>
                    <div className="text-[11px] bg-slate-950 p-3 rounded border border-slate-800 space-y-1">
                      <div className="text-emerald-400">{bill.fiscalImpact}</div>
                      <div className="text-red-400">{bill.publicImpact}</div>
                    </div>
                    {bill.stage === 'Presidential Assent Desk' && (
                      <div className="flex gap-2">
                        <button onClick={() => handleBillAction(bill, 'assent')} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded text-xs cursor-pointer">Sign into Law</button>
                        <button onClick={() => handleBillAction(bill, 'veto')} className="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded text-xs cursor-pointer">Veto Bill</button>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'cabinet' && (
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                {Object.entries(cabinet).map(([docket, min]) => (
                  <div key={docket} className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
                    <span className="text-[10px] text-amber-400 font-bold uppercase">CS {docket}</span>
                    <div className="font-bold text-sm text-slate-100">{min?.name || 'Vacant'}</div>
                    {min && (
                      <div className="text-[11px] text-slate-400 space-y-1 pt-1 border-t border-slate-800">
                        <div>Competence: <span className="text-slate-200">{min.competence}%</span></div>
                        <div>Region: <span className="text-slate-200">{min.region}</span></div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'military' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <div className="text-xs text-slate-400">Readiness</div>
                    <div className="text-2xl font-black text-emerald-400">{military.readiness}%</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <div className="text-xs text-slate-400">Total Troops</div>
                    <div className="text-2xl font-black text-slate-100">{military.troopCount.toLocaleString()}</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <div className="text-xs text-slate-400">Deployed</div>
                    <div className="text-2xl font-black text-amber-400">{military.deployedTroops.toLocaleString()}</div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'world' && (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {countries.map(c => (
                  <div key={c.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                      <span className="font-bold text-sm text-slate-100">{c.name}</span>
                      <span className="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-amber-400 font-bold">{c.status}</span>
                    </div>
                    <div className="text-xs text-slate-300">
                      <div>Alignment: <span className="text-emerald-400">{c.relation}%</span></div>
                      <div className="mt-1 text-[11px] text-slate-400 bg-slate-950 p-2 rounded border border-slate-800">Pact: {c.tradeDeal}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          <footer className="bg-slate-900 border-t border-slate-800 text-center text-xs text-slate-500 py-3">
