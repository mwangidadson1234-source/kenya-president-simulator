    // Shuffles an array randomly (Fisher-Yates) so the weekly issues come in a
    // different order each playthrough instead of always the same sequence.
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

      const currentIssue = emails.find(e => e.status === 'pending') || null;

      // Countdown effect: ticks every second while the game is running and there's
      // an active issue. When it hits zero, the issue counts as ignored.
      useEffect(() => {
        if (!inaugurated || !currentIssue) return;
        if (timeLeft <= 0) {
          handleIssueIgnored();
          return;
        }
        const timerId = setTimeout(() => setTimeLeft(t => t - 1), 1000);
        return () => clearTimeout(timerId);
      }, [timeLeft, inaugurated, currentIssue?.id]);

      // Called when the countdown runs out before the President responds.
      const handleIssueIgnored = () => {
        setAuthority(a => Math.max(0, a - 4));
        setUprisingRisk(r => Math.min(100, r + 6));
        setPublicApproval(p => Math.max(0, p - 5));
        if (currentIssue) {
          setEmails(prev => prev.map(e => e.id === currentIssue.id ? { ...e, category: 'read', status: 'ignored' } : e));
        }
        setTimeLeft(TIMER_SECONDS);
        advanceWeek();
      };

      // ADVANCE WEEK ENGINE: Generates dynamic emails, bills, and risk updates for all 240 weeks
      const advanceWeek = () => {
        const nextWeek = week + 1;
        setWeek(nextWeek);

        // Update Macro Metrics
        const updatedDebt = Math.min(95, debtRatio + 0.1);
        const updatedInflation = Math.max(3.5, inflation + (uprisingRisk > 40 ? 0.2 : -0.1));
        setDebtRatio(parseFloat(updatedDebt.toFixed(1)));
        setInflation(parseFloat(updatedInflation.toFixed(1)));

        // Risk Triggers
        let newUprising = uprisingRisk;
        if (publicApproval < 40) newUprising += 3;
        if (inflation > 7.0) newUprising += 2;
        setUprisingRisk(Math.min(100, Math.max(0, newUprising)));

        // PROCEDURAL DISPATCH GENERATOR
        // Pick the next issue from the shuffled queue. When the queue runs out,
        // reshuffle all 25 issues again so every one appears before any repeat.
        let queue = dispatchQueue;
        if (queue.length === 0) {
          queue = shuffleArray(ISSUE_BANK.map((_, idx) => idx));
        }
        const issueIndex = queue[0];
        setDispatchQueue(queue.slice(1));
        const issue = ISSUE_BANK[issueIndex];

        // Add dispatch to Inbox
        const newMail = {
          id: Date.now(),
          sender: issue.sender,
          subject: issue.subject,
          urgency: issue.urgency,
          body: issue.body,
          options: issue.options,
          category: 'unread',
          status: 'pending',
          date: `Week ${nextWeek}`
        };

        setEmails(prev => [newMail, ...prev]);

        // PROCEDURAL BILL GENERATOR (Generates new bills every 3 weeks)
        if (nextWeek % 3 === 0) {
          const newBill = {
            id: Date.now(),
            ministry: nextWeek % 2 === 0 ? 'Ministry of Agriculture' : 'Ministry of Health',
            title: nextWeek % 2 === 0 ? `Fertilizer Subsidy & Produce Levy Bill (Week ${nextWeek})` : `Universal Healthcare Fund Amendment (Week ${nextWeek})`,
            stage: 'Presidential Assent Desk',
            description: nextWeek % 2 === 0 ? 'Imposes a statutory import duty on foreign grain to protect local farmers.' : 'Mandates 2.75% payroll deductions for universal care coverage.',
            fiscalImpact: nextWeek % 2 === 0 ? '+20B KSh Agricultural Fund' : '+40B KSh Healthcare Reserve',
            publicImpact: nextWeek % 2 === 0 ? '+12% Rural Approval, -6% Business' : '+8% Civil Society, -10% Hustlers',
            status: 'pending'
          };
          setBills(prev => [newBill, ...prev]);
        }
      };

      // Handle Interactive Inbox Choices
      const handleMailChoice = (mail, option) => {
        if (option.authority) setAuthority(a => Math.min(100, Math.max(0, a + option.authority)));
        if (option.treasury) setTreasury(t => t + option.treasury);
        if (option.hustlers) setDemographics(d => ({ ...d, hustlers: Math.min(100, Math.max(0, d.hustlers + option.hustlers)) }));
        if (option.civilSociety) setDemographics(d => ({ ...d, civilSociety: Math.min(100, Math.max(0, d.civilSociety + option.civilSociety)) }));
        if (option.ruralFarmers) setDemographics(d => ({ ...d, ruralFarmers: Math.min(100, Math.max(0, d.ruralFarmers + option.ruralFarmers)) }));
        if (option.businessElites) setDemographics(d => ({ ...d, businessElites: Math.min(100, Math.max(0, d.businessElites + option.businessElites)) }));
        if (option.risk) setUprisingRisk(r => Math.min(100, Math.max(0, r + option.risk)));
        if (option.impeachment) setImpeachmentRisk(i => Math.min(100, Math.max(0, i + option.impeachment)));
        if (option.whip) setWhipScore(w => Math.min(100, Math.max(0, w + option.whip)));
        if (option.publicApproval) setPublicApproval(p => Math.min(100, Math.max(0, p + option.publicApproval)));
        if (option.readiness) setMilitary(m => ({ ...m, readiness: Math.min(100, Math.max(0, m.readiness + option.readiness)) }));

        setEmails(emails.map(e => e.id === mail.id ? { ...e, category: 'read', status: 'resolved' } : e));
        setSelectedMail(null);
        setTimeLeft(TIMER_SECONDS);
        advanceWeek();
      };

      // Moves a resolved or ignored issue from Read into Archived.
      const archiveMail = (id) => {
        setEmails(prev => prev.map(e => e.id === id ? { ...e, category: 'archived' } : e));
        setSelectedMail(null);
      };

      // Handle Grassroots Petitions
      const handlePetitionChoice = (pet, option) => {
        if (option.treasury) setTreasury(t => t + option.treasury);
        if (option.risk) setUprisingRisk(r => Math.min(100, Math.max(0, r + option.risk)));
        if (option.civilSociety) setDemographics(d => ({ ...d, civilSociety: Math.min(100, Math.max(0, d.civilSociety + option.civilSociety)) }));

        setPetitions(petitions.filter(p => p.id !== pet.id));
      };

      // Handle Legislative Assent / Veto
      const handleBillAction = (bill, action) => {
        if (action === 'assent') {
          setTreasury(t => t + 35);
          setPublicApproval(p => Math.max(10, p - 6));
          setBills(bills.map(b => b.id === bill.id ? { ...b, stage: 'Signed into Law', status: 'enacted' } : b));
        } else {
          setWhipScore(w => Math.max(20, w - 6));
          setPublicApproval(p => Math.min(100, p + 5));
          setBills(bills.map(b => b.id === bill.id ? { ...b, stage: 'Vetoed & Returned to Parliament', status: 'vetoed' } : b));
        }
      };

      // Cabinet Reshuffle & Sack Controls
      const sackMinister = (docket) => {
        setCabinet(prev => ({ ...prev, [docket]: null }));
        setAuthority(a => Math.max(10, a - 3));
      };

      const isCabinetComplete = Object.values(cabinet).every(val => val !== null);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between">
          
          {/* WEEK 1 INAUGURATION CABINET SELECTION */}
          {!inaugurated && (
            <div className="fixed inset-0 z-50 bg-slate-950/95 p-6 overflow-y-auto flex flex-col items-center">
              <div className="max-w-4xl w-full space-y-6 my-auto">
                <div className="text-center space-y-2">
                  <span className="px-3 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-full text-xs font-semibold uppercase">
                    State House Gazette Notice
                  </span>
                  <h1 className="text-3xl font-extrabold text-amber-500">
                    H.E. The President of Kenya, Commander-in-Chief
                  </h1>
                  <p className="text-slate-400 text-sm">
                    Select your Cabinet Secretaries across all dockets to form your administration before taking office.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {Object.keys(candidatePool).map(docket => (
                    <div key={docket} className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                      <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span className="font-bold text-slate-200 capitalize text-sm">
                          {docket === 'ag' ? 'Attorney General' : `CS ${docket}`}
                        </span>
                        {cabinet[docket] && <span className="text-xs text-emerald-400 font-bold">Appointed</span>}
                      </div>

                      <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                        {candidatePool[docket].map(cand => (
                          <div 
                            key={cand.name}
                            onClick={() => setCabinet(prev => ({ ...prev, [docket]: cand }))}
                            className={`p-3 rounded-lg border text-xs cursor-pointer flex justify-between items-center ${
                              cabinet[docket]?.name === cand.name 
                                ? 'bg-amber-500/20 border-amber-500 text-white' 
                                : 'bg-slate-950 border-slate-800 text-slate-300'
                            }`}
                          >
                            <div>
                              <div className="font-semibold">{cand.name}</div>
                              <div className="text-slate-500 text-[10px]">Region: {cand.region}</div>
                            </div>
                            <div className="text-right text-[11px] space-y-0.5">
                              <div className="text-blue-400">Comp: {cand.competence}%</div>
                              <div className="text-amber-400">Loyalty: {cand.loyalty}%</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>

                <button
                  disabled={!isCabinetComplete}
                  onClick={() => setInaugurated(true)}
                  className={`w-full py-4 rounded-xl font-bold text-sm uppercase tracking-wider transition-all ${
                    isCabinetComplete 
                      ? 'bg-amber-500 hover:bg-amber-400 text-slate-950 cursor-pointer shadow-lg shadow-amber-500/20' 
                      : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                  }`}
                >
                  {isCabinetComplete ? 'Take Oath of Office & Begin Term' : 'Appoint All Ministers to Proceed'}
                </button>
              </div>
            </div>
          )}

          {/* TOP DASHBOARD HEADER */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
              <div>
                <h1 className="text-lg font-black text-amber-500 flex items-center gap-2">
                  H.E. The President of Kenya, Commander-in-Chief
                </h1>
                <div className="text-xs text-slate-400 flex items-center gap-3">
                  <span>Term: <strong className="text-slate-200">Year {Math.ceil(week / 52)}, Week {week % 52 === 0 ? 52 : week % 52}</strong> ({week} / 240 Weeks)</span>
                  <span>•</span>
                  <span>Authority: <strong className="text-amber-400">{authority}%</strong></span>
                </div>
              </div>

              <div className="flex items-center gap-3 text-xs">
                <div className="bg-slate-950 border border-slate-800 rounded-lg p-2">
                  <div className="text-slate-400 text-[10px]">TREASURY</div>
                  <div className="font-bold text-amber-400">KSh {treasury}B</div>
                </div>
                <div className="bg-slate-950 border border-slate-800 rounded-lg p-2">
                  <div className="text-slate-400 text-[10px]">UPRISING RISK</div>
                  <div className={`font-bold ${uprisingRisk > 50 ? 'text-red-400 animate-pulse' : 'text-emerald-400'}`}>{uprisingRisk}%</div>
                </div>
                <div className="bg-slate-950 border border-slate-800 rounded-lg p-2">
                  <div className="text-slate-400 text-[10px]">IMPEACHMENT</div>
                  <div className={`font-bold ${impeachmentRisk > 50 ? 'text-red-400' : 'text-amber-400'}`}>{impeachmentRisk}%</div>
                </div>
                <div className={`border rounded-lg p-2 text-center ${
                  timeLeft < 120 ? 'bg-red-500/20 border-red-500 animate-pulse' : 'bg-slate-950 border-slate-800'
                }`}>
                  <div className="text-slate-400 text-[10px]">TIME TO DECIDE</div>
                  <div className={`font-black ${timeLeft < 120 ? 'text-red-400' : 'text-amber-400'}`}>
                    {String(Math.floor(timeLeft / 60)).padStart(2, '0')}:{String(timeLeft % 60).padStart(2, '0')}
                  </div>
                </div>
              </div>
            </div>
          </header>

          {/* MAIN TABS NAVIGATION */}
          <main className="max-w-7xl mx-auto px-4 py-6 w-full flex-grow">
            <div className="flex border-b border-slate-800 gap-2 mb-6 overflow-x-auto pb-1">
              {[
                { id: 'home', label: 'Executive Dashboard' },
                { id: 'inbox', label: `Inbox (${emails.filter(e => e.category === 'unread').length})` },
                { id: 'petitions', label: `Grassroots Petitions (${petitions.length})` },
                { id: 'bills', label: `Assent Desk (${bills.filter(b => b.stage === 'Presidential Assent Desk').length})` },
                { id: 'cabinet', label: 'Cabinet & Reshuffle' },
                { id: 'military', label: 'KDF Command' },
                { id: 'world', label: 'World Matrix' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2.5 rounded-t-lg font-bold text-xs transition-all border-b-2 cursor-pointer ${
                    activeTab === tab.id
                      ? 'border-amber-500 text-amber-400 bg-slate-900/60'
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {/* TAB 1: EXECUTIVE DASHBOARD */}
            {activeTab === 'home' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <span className="text-slate-400 text-xs font-semibold">Public Approval Rating</span>
                    <div className="text-2xl font-black text-slate-100">{publicApproval}%</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <span className="text-slate-400 text-xs font-semibold">Whip Control Score</span>
                    <div className="text-2xl font-black text-slate-100">{whipScore}%</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <span className="text-slate-400 text-xs font-semibold">Debt / GDP Ratio</span>
                    <div className="text-2xl font-black text-slate-100">{debtRatio}%</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <span className="text-slate-400 text-xs font-semibold">Inflation Index</span>
                    <div className="text-2xl font-black text-slate-100">{inflation}%</div>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                  <h3 className="font-bold text-sm text-slate-200 uppercase border-b border-slate-800 pb-2">Demographic Coalition Breakdown</h3>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    {Object.entries(demographics).map(([key, val]) => (
                      <div key={key} className="bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-1">
                        <div className="text-xs capitalize text-slate-300">{key}</div>
                        <div className="text-lg font-bold text-amber-400">{val}%</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: PRESIDENTIAL INBOX */}
            {activeTab === 'inbox' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                  <div className="flex border-b border-slate-800 gap-2 pb-2">
                    {['unread', 'read', 'archived'].map(cat => (
                      <button
                        key={cat}
                        onClick={() => setSelectedInboxTab(cat)}
                        className={`px-3 py-1 rounded text-xs capitalize font-semibold cursor-pointer ${
                          selectedInboxTab === cat ? 'bg-amber-500 text-slate-950' : 'text-slate-400'
                        }`}
                      >
                        {cat} ({emails.filter(e => e.category === cat).length})
                      </button>
                    ))}
                  </div>
                  <div className="space-y-2 max-h-[32rem] overflow-y-auto pr-1">
                    {emails.filter(e => e.category === selectedInboxTab).map(mail => (
                      <div
                        key={mail.id}
                        onClick={() => setSelectedMail(mail)}
                        className={`p-3 rounded-lg border cursor-pointer text-xs space-y-1 ${
                          selectedMail?.id === mail.id ? 'bg-amber-500/10 border-amber-500' : 'bg-slate-950 border-slate-800'
                        }`}
                      >
                        <div className="flex justify-between font-bold text-slate-200">
                          <span>{mail.sender}</span>
                          <span className="text-[10px] text-slate-500">{mail.date}</span>
                        </div>
                        <div className="text-slate-300 truncate">{mail.subject}</div>
                        <div className="flex justify-between items-center pt-0.5">
                          <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded uppercase ${
                            mail.urgency === 'High' ? 'bg-red-500/20 text-red-400' :
                            mail.urgency === 'Medium' ? 'bg-amber-500/20 text-amber-400' :
                            'bg-slate-700/40 text-slate-400'
                          }`}>{mail.urgency} Attention</span>
                          {mail.status === 'ignored' && <span className="text-[9px] text-red-400 font-bold">IGNORED</span>}
                        </div>
                      </div>
                    ))}
                    {emails.filter(e => e.category === selectedInboxTab).length === 0 && (
                      <div className="text-xs text-slate-500 text-center py-6">Nothing here yet.</div>
                    )}
                  </div>
                </div>

                <div className="md:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-6">
                  {selectedMail ? (
                    <div className="space-y-4">
                      <div className="border-b border-slate-800 pb-2 flex justify-between items-start">
                        <div>
                          <h2 className="text-lg font-bold text-amber-400">{selectedMail.subject}</h2>
                          <div className="text-xs text-slate-400">From: {selectedMail.sender} | {selectedMail.date}</div>
                        </div>
                        <span className={`text-[10px] font-bold px-2 py-1 rounded uppercase ${
                          selectedMail.urgency === 'High' ? 'bg-red-500/20 text-red-400' :
                          selectedMail.urgency === 'Medium' ? 'bg-amber-500/20 text-amber-400' :
                          'bg-slate-700/40 text-slate-400'
                        }`}>{selectedMail.urgency} Attention</span>
                      </div>
                      <p className="text-sm text-slate-300 leading-relaxed">{selectedMail.body}</p>
                      {selectedMail.status === 'pending' ? (
                        <div className="space-y-2 pt-4 border-t border-slate-800">
                          <div className="text-xs font-bold text-slate-400 uppercase">Issue Presidential Order:</div>
                          {selectedMail.options.map((opt, idx) => (
                            <button
                              key={idx}
                              onClick={() => handleMailChoice(selectedMail, opt)}
                              className="w-full text-left p-3 rounded-lg bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs text-slate-200 cursor-pointer transition-all"
                            >
                              {opt.text}
                            </button>
                          ))}
                        </div>
                      ) : (
                        <div className="pt-3 space-y-3 border-t border-slate-800">
                          {selectedMail.status === 'ignored' ? (
                            <div className="text-xs text-red-400 font-semibold">
                              ✗ No decision was made in time — treated as ignored, with a small hit to Authority, Public Approval and Uprising Risk.
                            </div>
                          ) : (
                            <div className="text-xs text-emerald-400 font-semibold">
                              ✓ Presidential Directive Actioned and Dispatched.
                            </div>
                          )}
                          {selectedMail.category !== 'archived' && (
                            <button
                              onClick={() => archiveMail(selectedMail.id)}
                              className="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded cursor-pointer"
                            >
                              Archive
                            </button>
                          )}
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="h-full flex items-center justify-center text-slate-500 text-xs">
                      Select an incoming dispatch to issue presidential orders.
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB 3: GRASSROOTS PETITIONS */}
            {activeTab === 'petitions' && (
              <div className="space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {petitions.length > 0 ? petitions.map(pet => (
                    <div key={pet.id} className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3">
                      <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span className="font-bold text-amber-400 text-xs">{pet.organization}</span>
                        <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-red-500/20 text-red-400 border border-red-500/30">
                          {pet.urgency}
                        </span>
                      </div>
                      <h4 className="font-bold text-sm text-slate-100">{pet.title}</h4>
                      <p className="text-xs text-slate-300">{pet.description}</p>
                      <div className="space-y-2 pt-2">
                        {pet.options.map((opt, i) => (
                          <button
                            key={i}
                            onClick={() => handlePetitionChoice(pet, opt)}
                            className="w-full text-left p-2.5 rounded bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs text-slate-200 cursor-pointer"
                          >
                            {opt.text}
                          </button>
                        ))}
                      </div>
                    </div>
                  )) : (
                    <div className="col-span-2 text-center py-10 text-slate-500 text-xs">
                      No active grassroots strikes or petitions currently logged. Advance week to update monitoring.
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB 4: LEGISLATIVE ASSENT DESK */}
            {activeTab === 'bills' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {bills.map(bill => (
                  <div key={bill.id} className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                      <span className="text-xs text-amber-400 font-semibold">{bill.ministry}</span>
                      <span className="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-300 font-bold">{bill.stage}</span>
                    </div>
                    <h4 className="font-bold text-sm text-slate-100">{bill.title}</h4>
                    <p className="text-xs text-slate-300">{bill.description}</p>
                    <div className="text-[11px] bg-slate-950 p-3 rounded border border-slate-800 space-y-1">
                      <div className="text-emerald-400">{bill.fiscalImpact}</div>
                      <div className="text-red-400">{bill.publicImpact}</div>
                    </div>
                    {bill.stage === 'Presidential Assent Desk' ? (
                      <div className="flex gap-2">
                        <button onClick={() => handleBillAction(bill, 'assent')} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded text-xs cursor-pointer">Sign into Law</button>
                        <button onClick={() => handleBillAction(bill, 'veto')} className="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded text-xs cursor-pointer">Veto Bill</button>
                      </div>
                    ) : (
                      <div className="text-xs text-slate-400 italic">Bill status updated in State Gazette.</div>
                    )}
                  </div>
                ))}
              </div>
            )}

            {/* TAB 5: CABINET & RESHUFFLE ENGINE */}
            {activeTab === 'cabinet' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <h3 className="font-bold text-sm text-slate-200 uppercase">Cabinet Secretaries & Dockets</h3>
                  <span className="text-xs text-slate-400">Click "Sack CS" to re-open docket for selection</span>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  {Object.entries(cabinet).map(([docket, min]) => (
                    <div key={docket} className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
                      <div className="flex justify-between items-center">
                        <span className="text-[10px] text-amber-400 font-bold uppercase">CS {docket}</span>
                        {min && (
                          <button 
                            onClick={() => sackMinister(docket)} 
                            className="text-[10px] bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-2 py-0.5 rounded cursor-pointer"
                          >
                            Sack CS
                          </button>
                        )}
                      </div>
                      <div className="font-bold text-sm text-slate-100">{min?.name || 'Vacant / Unappointed'}</div>
                      {min ? (
                        <div className="text-[11px] text-slate-400 space-y-1 pt-1 border-t border-slate-800">
                          <div>Competence: <span className="text-slate-200">{min.competence}%</span></div>
                          <div>Region: <span className="text-slate-200">{min.region}</span></div>
                        </div>
                      ) : (
                        <div className="space-y-1 pt-2 max-h-40 overflow-y-auto pr-1">
                          {candidatePool[docket].map(c => (
                            <button
                              key={c.name}
                              onClick={() => setCabinet(prev => ({ ...prev, [docket]: c }))}
                              className="w-full text-left p-1.5 rounded bg-slate-950 hover:bg-slate-800 border border-slate-800 text-[10px] text-slate-200 cursor-pointer"
                            >
                              Appoint {c.name} <span className="text-slate-500">(Comp {c.competence}%)</span>
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 6: KDF MILITARY COMMAND */}
            {activeTab === 'military' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <div className="text-xs text-slate-400">Combat Readiness</div>
                    <div className="text-2xl font-black text-emerald-400">{military.readiness}%</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <div className="text-xs text-slate-400">Active Troop Capacity</div>
                    <div className="text-2xl font-black text-slate-100">{military.troopCount.toLocaleString()}</div>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <div className="text-xs text-slate-400">Deployed Force</div>
                    <div className="text-2xl font-black text-amber-400">{military.deployedTroops.toLocaleString()}</div>
                  </div>
                </div>

                <h3 className="font-bold text-sm text-slate-200 uppercase border-b border-slate-800 pb-2">Active Deployments</h3>
                <div className="space-y-3">
                  {military.activeOperations.map(op => (
                    <div key={op.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex justify-between items-center text-xs">
                      <div>
                        <div className="font-bold text-slate-100 text-sm">{op.name}</div>
                        <div className="text-slate-400">Troops Committed: {op.troops} | Sector Cost: KSh {op.cost}B / Month</div>
                      </div>
                      <span className="px-2 py-1 rounded bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold">
                        Risk: {op.risk}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 7: WORLD MATRIX */}
            {activeTab === 'world' && (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {countries.map(c => (
                  <div key={c.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                      <span className="font-bold text-sm text-slate-100">{c.name}</span>
                      <span className="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-amber-400 font-bold">{c.status}</span>
                    </div>
                    <div className="text-xs text-slate-300">
                      <div>Alignment Index: <span className="text-emerald-400">{c.relation}%</span></div>
                      <div className="mt-1 text-[11px] text-slate-400 bg-slate-950 p-2 rounded border border-slate-800">Pact: {c.tradeDeal}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          <footer className="bg-slate-900 border-t border-slate-800 text-center text-xs text-slate-500 py-3">
            Statecraft Kenya: Modern Presidential Simulator • Executive Command Suite
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
